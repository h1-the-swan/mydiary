services:
  backend:
    build: ./backend
    restart: unless-stopped
    # user: ${UID}:${GUID}
    volumes:
      - ./backend:/usr/local/src/app/backend
      # NOTE: deps are installed into the system Python at build time
      # (virtualenvs.create false), so the app never touches ./backend/.venv.
      # Do NOT run `poetry install`/`poetry lock` *inside* this container --
      # Poetry would recreate the host's .venv (via this bind mount) as a
      # broken, root-owned, container-Python venv. Run Poetry on the host.
      # specify joplin data as a persistent docker volume (defined below)
      - joplin_data:/root/.config/joplin
      # use timezone information from host machine
      # - /etc/timezone:/etc/timezone:ro
      # - /etc/localtime:/etc/localtime:ro
    env_file:
      - ./backend/.env
    environment:
      - HOSTNAME=${NAME}
      # This ensures that errors are printed as they occur, which
      # makes debugging easier.
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
      - DEV_MODE=1
      # override these variables from the .env file:
      - SPOTIFY_TOKEN_CACHE_PATH=/usr/local/src/app/backend/token_cache/spotify.json
      - GOOGLECALENDAR_TOKEN_CACHE=/usr/local/src/app/backend/token_cache/googlecalendar_token.json
      - GOOGLECALENDAR_CREDENTIALS_FILE=/usr/local/src/app/backend/token_cache/googlecalendar_credentials.json
      # no port: the backend scans Joplin's port range (41184-41194) and
      # finds the data API wherever it landed
      - JOPLIN_BASE_URL=http://host.docker.internal
      # the owntracks recorder runs in its own compose project on the host
      - OWNTRACKS_RECORDER_URL=http://host.docker.internal:8083
    extra_hosts:
      # Docker Desktop provides this name automatically; a native Linux Docker
      # Engine does not, so map it explicitly for JOPLIN_BASE_URL above.
      - "host.docker.internal:host-gateway"
    # command: ["main:app", "--host", "0.0.0.0", "--reload"]
  mydiary-vuetify:
    build: ./mydiary-vuetify
    restart: unless-stopped
    # user: ${UID}:${GUID}
    volumes:
      - ./mydiary-vuetify:/usr/local/src/app/mydiary-vuetify
      # JavaScript dependencies live inside the directory mounted above, so
      # this anonymous volume keeps the image's `node_modules` from being
      # shadowed by the host (which has no matching install). NOTE: it is not
      # refreshed automatically -- after changing dependencies, recreate it
      # with `docker compose up --build -V`.
      - /usr/local/src/app/mydiary-vuetify/node_modules
      # use timezone information from host machine
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=development
      # The HMR websocket connects straight to the published port below rather
      # than through the proxy; vite.config.ts explains why it has to be told.
      - VITE_HMR_CLIENT_PORT=${MYDIARY_VITE_PORT:-3001}
    ports:
      # Direct access to the Vite dev server. Not needed to use the app --
      # proxy-vue reaches it over the compose network and serves it on the
      # MYDIARY_HTTP_PORT below. The port is a variable so a second stack (a
      # git worktree) can bind elsewhere; see the "Git worktrees" section of
      # CLAUDE.md.
      - 127.0.0.1:${MYDIARY_VITE_PORT:-3001}:3001
  proxy-vue:
    image: nginx:1.30
    restart: unless-stopped
    volumes:
      - ./nginx-vue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # The app's URL. Variable so a worktree stack can coexist -- see the
      # "Git worktrees" section of CLAUDE.md.
      - ${MYDIARY_HTTP_PORT:-8086}:80
    depends_on:
      - backend
      - mydiary-vuetify
    networks:
      - proxy-tier
      - default
  tailscale:
    image: tailscale/tailscale:latest
    hostname: mydiary
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}          # from project-root .env (gitignored)
      - TS_HOSTNAME=mydiary               # -> mydiary.<tailnet>.ts.net
      - TS_STATE_DIR=/var/lib/tailscale   # persist node identity across restarts
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true                 # default; no /dev/net/tun or NET_ADMIN needed
      - TS_ACCEPT_DNS=false               # keep Docker's DNS so "proxy-vue" still resolves
      - TS_EXTRA_ARGS=--advertise-tags=tag:mydiary   # ACL'd as a server node, not a user device
    volumes:
      - tailscale_state:/var/lib/tailscale
      # MUST mount the DIRECTORY, not the file -- tailscaled only picks up
      # serve config changes when the parent dir is bind-mounted.
      - ./tailscale:/config
    networks:
      - proxy-tier                        # same network as proxy-vue so the name resolves
    restart: unless-stopped
    depends_on:
      - proxy-vue
  # cloudflared:
  #   image: cloudflare/cloudflared:2023.5.1
  #   # volumes: 
  #   #   - ./cloudflared:/etc/cloudflared
  #   # env_file:
  #   #   - ./cloudflared/cloudflared.env
  #   # command: 'tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN} --hello-world'
  #   # command: 'tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN} --url http://localhost:48916'
  #   # command: 'tunnel --no-autoupdate --loglevel debug run --token ${CLOUDFLARED_TOKEN} --url http://proxy:80'
  #   command: 'tunnel --no-autoupdate --loglevel debug run --token ${CLOUDFLARED_TOKEN}'
  #   # ports:
  #   #   - 8080:8080
  #   restart: 'on-failure'
  #   networks:
  #     - proxy-tier
  #   depends_on:
  #     - proxy

volumes:
  joplin_data:
  tailscale_state:

networks:
  proxy-tier:
